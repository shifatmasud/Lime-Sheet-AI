<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" role="img" aria-label="LimeSheet">
  <title>LimeSheet</title>
  <desc>LimeSheet mark: a single white script L that writes itself on lime.</desc>
  <style>
    .mark{stroke:#FFFFFF;fill:none;stroke-width:26.0;
          stroke-linecap:round;stroke-linejoin:round}
    .draw{stroke-dasharray:1489.56 2979.12;
          animation:write 3.6s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes write{
      0%       {stroke-dashoffset:1489.56}
      37.50%  {stroke-dashoffset:0}
      56.94%  {stroke-dashoffset:0}
      84.72%  {stroke-dashoffset:1489.56}
      100%     {stroke-dashoffset:1489.56}
    }
    @media (prefers-reduced-motion:reduce){
      .draw{animation:none;stroke-dashoffset:0}
    }
  </style>
  <rect width="720" height="692" rx="33" fill="#C8F560"/>
